# Example: one job, both gates.
#
# Copy this file to `.github/workflows/gates.yml`. It checks PoC tests with
# realism-gate and draft findings with viability-gate, uploads one SARIF file,
# and keeps a single pull-request comment.
#
# `uses: KhomDev/realism-gate/combined@v0.5.0` is this repository's
# `combined/action.yml`. Pin a tag once you have one. Until then, a checkout
# of this repo can use `./combined`.

name: gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: KhomDev/realism-gate/combined@v0.5.0
        with:
          path: test/
          findings: ""
          fail-on: warn
          sarif: "true"
          comment: "true"
