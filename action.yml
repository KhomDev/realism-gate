name: realism-gate
description: Check Foundry PoC tests for what makes a passing PoC prove less than it claims.
author: KhomDev
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: Release to run, e.g. v0.1.0. Defaults to the action's own ref when it is a release tag.
    required: false
    default: ""
  paths:
    description: Space-separated files or directories to check.
    required: false
    default: test
  fail-on:
    description: error, warn, note or never.
    required: false
    default: error
  declaration:
    description: Path to a realism.yaml. Empty means ./realism.yaml if it exists.
    required: false
    default: ""
  args:
    description: Extra arguments passed to `realism-gate check`.
    required: false
    default: ""
  upload-sarif:
    description: Upload the results to GitHub code scanning (needs security-events write).
    required: false
    default: "false"

outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Download and verify realism-gate
      id: install
      shell: bash
      env:
        RG_VERSION: ${{ inputs.version }}
        RG_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="$RG_VERSION"
        if [ -z "$version" ]; then
          case "$RG_ACTION_REF" in
            v*) version="$RG_ACTION_REF" ;;
            *) echo "::error::set the 'version' input (the action ref '$RG_ACTION_REF' is not a release tag)"; exit 1 ;;
          esac
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=x86_64-unknown-linux-gnu; ext=tar.gz ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
          macOS-X64) target=x86_64-apple-darwin; ext=tar.gz ;;
          macOS-ARM64) target=aarch64-apple-darwin; ext=tar.gz ;;
          Windows-X64) target=x86_64-pc-windows-msvc; ext=zip ;;
          *) echo "::error::no realism-gate build for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        name="realism-gate-${version#v}-$target"
        base="https://github.com/KhomDev/realism-gate/releases/download/$version"
        dir="$RUNNER_TEMP/realism-gate"
        mkdir -p "$dir"
        cd "$dir"
        curl -fsSL -o "$name.$ext" "$base/$name.$ext"
        curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
        grep " ./$name.$ext\$" SHA256SUMS | sed 's# \./# #' > check.txt
        test -s check.txt
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c check.txt
        else
          shasum -a 256 -c check.txt
        fi
        if [ "$ext" = zip ]; then
          unzip -q -o "$name.zip" -d "$name"
          bin="$dir/$name/realism-gate.exe"
        else
          tar xzf "$name.tar.gz"
          bin="$dir/$name/realism-gate"
        fi
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    - name: Run realism-gate
      id: run
      shell: bash
      env:
        RG_BIN: ${{ steps.install.outputs.bin }}
        RG_PATHS: ${{ inputs.paths }}
        RG_FAIL_ON: ${{ inputs.fail-on }}
        RG_DECLARATION: ${{ inputs.declaration }}
        RG_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        sarif="$RUNNER_TEMP/realism-gate.sarif"
        decl=()
        if [ -n "$RG_DECLARATION" ]; then decl=(--declaration "$RG_DECLARATION"); fi
        # shellcheck disable=SC2086
        "$RG_BIN" check $RG_PATHS "${decl[@]}" --format sarif --output "$sarif" --fail-on never $RG_ARGS
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2086
        "$RG_BIN" check $RG_PATHS "${decl[@]}" --color always --fail-on "$RG_FAIL_ON" $RG_ARGS
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: realism-gate

    - name: Fail on findings
      shell: bash
      env:
        RG_STATUS: ${{ steps.run.outputs.status }}
      run: exit "$RG_STATUS"
