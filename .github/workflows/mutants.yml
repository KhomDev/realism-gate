name: mutants

# A weekly measurement, not a gate. It lives in its own workflow so the
# regular CI jobs (test, package, msrv, deny, audit, no-network, hygiene,
# corpus, eval) do not run on a schedule.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated --file globs to mutate instead of the weekly set (changed files on a work branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cdd500fcb345d29dabc5617aab1edf24d5211116 # cargo-mutants tag
        with:
          tool: cargo-mutants

      # Survivors are review leads, not failures. The step is allowed to fail
      # so a surviving mutant never blocks the branch; the recorded numbers
      # are in the summary below.
      - name: Mutate the requested files
        if: ${{ inputs.files != '' }}
        continue-on-error: true
        env:
          FILES: ${{ inputs.files }}
        run: |
          args=()
          for f in $FILES; do args+=(--file "$f"); done
          cargo mutants --workspace "${args[@]}" --timeout 300

      - name: Mutate the rule, claim, bind and verify-fix code
        if: ${{ inputs.files == '' }}
        continue-on-error: true
        run: |
          cargo mutants --workspace \
            --file 'crates/rg-rules/src/rules/*.rs' \
            --file 'crates/rg-model/src/claims/*.rs' \
            --file 'src/bind/*.rs' \
            --file 'crates/rg-exec/src/lib.rs' \
            --timeout 120

      - name: Record the survival rate
        if: always()
        shell: bash
        run: |
          set -u
          if [ ! -d mutants.out ]; then
            echo "cargo-mutants produced no outcomes; see the step log above" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          caught=$(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0)
          missed=$(wc -l < mutants.out/missed.txt 2>/dev/null || echo 0)
          timedout=$(wc -l < mutants.out/timeout.txt 2>/dev/null || echo 0)
          unviable=$(wc -l < mutants.out/unviable.txt 2>/dev/null || echo 0)
          total=$((caught + missed))
          {
            echo "## cargo-mutants (weekly)"
            echo
            echo "caught: ${caught} · missed: ${missed} · timeout: ${timedout} · unviable: ${unviable}"
            if [ "$total" -gt 0 ]; then
              echo
              echo "survival rate: ${missed} of ${total} = $((100 * missed / total))%"
            fi
            echo
            echo "docs/test-quality.md says which scopes this covers. It is not a gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 90
