name: release

# Triggered by a tag matching v*, e.g. v0.1.0.
#
# Nothing here publishes to crates.io. The crate name is claimed permanently
# and the action is irreversible, so publishing is a separate, manual step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release whose tag does not match the crate version, or whose tests fail,
  # is worse than no release.
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the Cargo.toml version
        id: version
        shell: bash
        run: |
          set -eu
          tag="${{ github.ref_name }}"
          version=$(grep -E '^version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          name="realism-gate-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          if [ "${{ matrix.archive }}" = "zip" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/realism-gate$ext" "dist/$name/"
          cp "target/${{ matrix.target }}/release/rgate$ext" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$name" && 7z a "../$name.zip" . >/dev/null)
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download every artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          # index() rather than a regex: '[' would open a bracket expression.
          awk -v h="## [$version]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'EOF'

          ### Verify the download

              sha256sum -c SHA256SUMS --ignore-missing
              gh attestation verify <asset> --repo KhomDev/realism-gate

          Two binaries are included, `realism-gate` and `rgate`. They are the
          same program.
          EOF

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body_path: notes.md
          fail_on_unmatched_files: true
