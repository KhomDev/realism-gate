[package]
name = "rg-program"
version = "1.5.0"
edition.workspace = true
rust-version.workspace = true
description = "Entry-point authority model for realism-gate: which authority each Anchor, native Solana or Solidity entry point requires. Internal crate of realism-gate: no API stability guarantee outside that package."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["realism-gate", "security", "poc"]

[dependencies]
# The Rust parser: Anchor programs and native Solana handlers are Rust source.
syn.workspace = true
# `syn` spans report a line and column only when proc-macro2's `span-locations`
# feature is on; the workspace dependency sets exactly that feature. Without
# it every span of every Anchor and native fixture would be (0, 0).
proc-macro2.workspace = true
# The Solidity parser written for the Foundry toolchain.
solar-parse.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
