[package]
name = "realism-gate"
version = "0.5.0"
edition = "2024"
description = "Static checker for Foundry and Solana (Rust and Anchor TypeScript) PoC tests: does the proof of concept show what an unprivileged attacker can do, or only what the harness made true?"
license = "MIT"
repository = "https://github.com/KhomDev/realism-gate"
homepage = "https://khomdev.org/tools"
readme = "README.md"
keywords = ["foundry", "solana", "anchor", "security", "poc"]
categories = ["command-line-utilities", "development-tools::testing"]
rust-version = "1.95"
# The published crate is the program and its licence, nothing else: no
# fixtures, no corpus, no workflows, no evaluation data.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# Two binaries, same program: `realism-gate` and the short `rgate`.
[[bin]]
name = "realism-gate"
path = "src/bin/realism-gate.rs"

[[bin]]
name = "rgate"
path = "src/bin/rgate.rs"

[[bin]]
name = "realism-gate-mcp"
path = "src/bin/realism-gate-mcp.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# The TypeScript parser of the Oxc toolchain, for Anchor's tests. Pinned: oxc
# releases break their API on every minor version, and 0.146 is the last that
# builds on the minimum supported Rust (1.95).
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_span = "=0.146.0"
# Positions for the Rust parser: line, column and byte range of every span.
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
# The Solidity parser written for the Foundry toolchain.
solar-parse = "0.2.0"
# The Rust parser used by the Rust compiler's own macro ecosystem.
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing"] }
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# cargo-binstall: where the release workflow puts each archive and what is in
# it. Spelled out rather than left to binstall's guessing, and checked by the
# release workflow's dry run, which installs through this metadata.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.zip"
pkg-fmt = "zip"
