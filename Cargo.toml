[package]
name = "realism-gate"
version = "0.1.0"
edition = "2024"
description = "Static checker for Foundry PoC tests: does the proof of concept show what an unprivileged attacker can do, or only what the harness made true?"
license = "MIT"
repository = "https://github.com/KhomDev/realism-gate"
homepage = "https://github.com/KhomDev/realism-gate"
readme = "README.md"
keywords = ["foundry", "solidity", "security", "bug-bounty", "poc"]
categories = ["command-line-utilities", "development-tools::testing"]
rust-version = "1.95"
exclude = ["/.github", "/examples", "/scripts", "/tests/fixtures"]

# Two binaries, same program: `realism-gate` and the short `rgate`.
[[bin]]
name = "realism-gate"
path = "src/bin/realism-gate.rs"

[[bin]]
name = "rgate"
path = "src/bin/rgate.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
# The Solidity parser written for the Foundry toolchain.
solar-parse = "0.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
